syntax = "proto3";

service Lab6 {
  rpc Add        (AddMsg)        returns (AddReply);
  rpc RawImage   (ImageMsg)      returns (ImageReply);
  rpc DotProduct (DotProductMsg) returns (DotProductReply);
  rpc JsonImage  (JsonImageMsg)  returns (ImageReply);
}

message AddMsg { int32 a = 1; int32 b = 2; }
message AddReply { int32 sum = 1; }

message ImageMsg { bytes img = 1; }
message JsonImageMsg { string image = 1; }  // base64 string
message ImageReply { int32 width = 1; int32 height = 2; }

message DotProductMsg { repeated double a = 1; repeated double b = 2; }
message DotProductReply { double dotproduct = 1; }